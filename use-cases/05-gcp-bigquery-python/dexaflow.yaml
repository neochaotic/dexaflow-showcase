schema_version: "1.0"
dag_id: showcase_bigquery_python
description: Queries BigQuery from plain Python tasks with the google-cloud-bigquery client.
owner: showcase
tags:
  - showcase
  - gcp
python_version: "3.12"
# Pinned: without a floor uv picks a 2021 provider that breaks on Airflow 3,
# and an exact pin lets a code-only change reuse the dependency image.
dependencies:
  - apache-airflow-providers-google==22.8.0
  - google-cloud-bigquery==3.27.0
variables:
  - GCP_PROJECT
