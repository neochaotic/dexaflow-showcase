schema_version: "1.0"
dag_id: showcase_bigquery_python
description: Queries BigQuery from plain Python tasks with the google-cloud-bigquery client.
owner: showcase
tags:
  - showcase
  - gcp
python_version: "3.12"
# No Airflow provider: the tasks use the BigQuery client library directly. An
# exact pin lets a code-only change reuse the dependency image.
dependencies:
  - google-cloud-bigquery==3.27.0
variables:
  - GCP_PROJECT
