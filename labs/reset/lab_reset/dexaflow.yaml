schema_version: "1.0"
dag_id: lab_reset
description: Deletes every table in the lab's BigQuery datasets, to start the lab from zero.
owner: lab
tags:
  - lab
  - gcp
python_version: "3.12"
# No Airflow provider: the task uses the BigQuery client library directly. The
# same pin as the use cases lets the dependency image be reused.
dependencies:
  - google-cloud-bigquery==3.27.0
variables:
  - GCP_PROJECT
  - LAB_DATASET
