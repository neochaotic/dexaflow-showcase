schema_version: "1.0"
dag_id: lab_00_setup
description: Creates the lab dataset and copies the raw e-commerce tables from a public dataset.
owner: lab
tags:
  - lab
  - gcp
python_version: "3.11"
connectors:
  - gcp
# Without a floor, uv can fall back to a 2021 provider that breaks on Airflow 3.
dependencies:
  - apache-airflow-providers-google>=18
connections:
  - google_cloud_default
variables:
  - GCP_PROJECT
  - LAB_DATASET
