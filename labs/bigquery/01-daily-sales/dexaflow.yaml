schema_version: "1.0"
dag_id: lab_01_daily_sales
description: Daily ELT from the raw tables to a staging table and a sales mart, one day per run.
owner: lab
tags:
  - lab
  - gcp
python_version: "3.11"
connectors:
  - gcp
# Without a floor, uv can fall back to a 2021 provider that breaks on Airflow 3.
dependencies:
  - apache-airflow-providers-google>=18
connections:
  - google_cloud_default
variables:
  - GCP_PROJECT
  - LAB_DATASET
# Ship the SQL files with the DAG (only dag.py is copied otherwise).
include_paths:
  - sql
