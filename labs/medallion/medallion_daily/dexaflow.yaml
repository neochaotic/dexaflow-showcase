schema_version: "1.0"
dag_id: lab_medallion_daily
description: Generates synthetic e-commerce events with DuckDB and builds bronze, silver and gold layers in BigQuery.
owner: lab
tags:
  - lab
  - gcp
python_version: "3.12"
# The gcp connector installs the Google provider (BigQuery operators and the
# google-cloud-bigquery client). DuckDB generates the data inside the task pod.
connectors:
  - gcp
# Without a floor, uv can fall back to a 2021 provider that breaks on Airflow 3.
dependencies:
  - apache-airflow-providers-google>=18
  - duckdb==1.4.4
connections:
  - google_cloud_default
variables:
  - GCP_PROJECT
  - LAB_DATASET
# Ship the SQL files with the DAG (only dag.py is copied otherwise).
include_paths:
  - sql
