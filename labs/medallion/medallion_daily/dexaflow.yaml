schema_version: "1.0"
dag_id: lab_medallion_daily
description: Generates synthetic e-commerce events with DuckDB and builds bronze, silver and gold layers in BigQuery.
owner: lab
tags:
  - lab
  - gcp
python_version: "3.12"
# No Airflow provider: the tasks use the BigQuery client library directly,
# which keeps the image small (the provider's operators work since Dexaflow
# 0.5.10, dexadata/dexaflow#2473). DuckDB generates the data inside the
# task pod, Jinja renders the SQL files. Exact pins let a code-only change
# reuse the dependency image.
dependencies:
  - google-cloud-bigquery==3.27.0
  - duckdb==1.4.4
  - jinja2==3.1.6
variables:
  - GCP_PROJECT
  - LAB_DATASET
# Ship the SQL files with the DAG (only dag.py is copied otherwise).
include_paths:
  - sql
