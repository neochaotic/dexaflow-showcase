# Small Postgres and Redis for the local and GKE lab environments: official
# images, no Redis auth. Postgres keeps its data on a PersistentVolumeClaim, so
# it survives a pod restart or, on GKE, a Spot node being reclaimed; Redis holds
# nothing that must survive. Not for production (see docs/gke.md).
# Adapted from the upstream PoC recipe (helm/dexaflow/examples/README.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-data }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  replicas: 1
  # One pod at a time: the volume attaches to a single node.
  strategy: { type: Recreate, rollingUpdate: null }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: __POSTGRES_IMAGE__
          env:
            - { name: POSTGRES_USER, value: dexaflow }
            - { name: POSTGRES_DB, value: dexaflow }
            - { name: POSTGRES_PASSWORD, value: __PG_PASSWORD__ }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "dexaflow", "-d", "dexaflow"] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: postgres-data } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: { app: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: __REDIS_IMAGE__
          args: ["--save", "", "--appendonly", "no"]
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
